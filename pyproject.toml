[project]
name = "crowd-shelter"
version = "0.1.0"
description = "Capacity-aware shelter allocation for urban emergency scenarios"
requires-python = ">=3.11"
dependencies = [
    "osmnx>=2.0",
    "networkx>=3.4",
    "geopandas>=1.0",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowd_shelter"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort — סדר ייבואים
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear — באגים נפוצים
    "SIM",      # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]


[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["osmnx.*", "geopandas.*", "shapely.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/crowd_shelter --cov-report=term-missing"


[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]


[tool.importlinter]
root_package = "crowd_shelter"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "crowd_shelter.infrastructure",
    "crowd_shelter.application",
    "crowd_shelter.domain",
]